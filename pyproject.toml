[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaeid"
version = "0.1.0"
description = "Where AAE detectors break: baselines and cross-register evaluation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
